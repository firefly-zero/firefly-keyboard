[package]
name = "firefly-keyboard"
version = "0.1.3"
edition = "2024"
rust-version = "1.91.0"
authors = ["Firefly Zero team"]
description = "Virtual keyboard for Firefly Zero apps"
repository = "https://github.com/firefly-zero/firefly-keyboard"
license = "MIT"
keywords = ["gamedev", "firefly-zero"]
categories = ["game-development", "no-std", "wasm"]

[dependencies]
firefly-rust = "0.14.0"

[dev-dependencies]
firefly-rust = { version = "0.14.0", features = ["talc"] }

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true    # Automatically strip symbols from the binary.
opt-level = "z" # Optimize for size.
lto = true      # Enable link-time optimization
